image: fedora:latest

before_script:
  - dnf update -y
  - dnf install -y acl gawk which fakeroot rpm-build wget fedpkg gcc gcc-c++ make
  - umask 0022

build_rpm:
  stage: build
  script:
    - wget https://api.github.com/repos/GrapheneOS/hardened_malloc/tarball/2026100600
    - echo "139767c8d48caea5cf7180a46bad9c39b398842a8f5d90c1388333a10596cc156440f7eb7b23530e1c79f9f8a77e194987429c3ef793ffb948eb69a5c49db009  2026100600" | sha512sum -c
    - fedpkg --release f44 local
  artifacts:
    paths:
        - x86_64/hardened_malloc*.x86_64.rpm
        - hardened_malloc*.src.rpm
